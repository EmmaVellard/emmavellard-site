<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc"><title id="title">19 of 1,425 lunar interiors satisfy mass, moment of inertia and core-radius constraints</title><desc id="desc">The 19 retained interiors comprise 7 homogeneous, 5 layered and 7 FeO-rich mantles. Counts from panel 2 of the DPS 2026 poster.</desc><g font-family="Arial, sans-serif"><text x="30" y="67" fill="#0d2140" font-size="46" font-weight="600">1,425</text><text x="30" y="100" fill="#44597a" font-size="18">Mass-matching interiors</text><path d="M290 60 H380 l-10 -7 M380 60 l-10 7" fill="none" stroke="#44597a" stroke-width="2"/><text x="425" y="67" fill="#0d2140" font-size="46" font-weight="600">19</text><text x="425" y="100" fill="#44597a" font-size="18">Also match moment of inertia</text><text x="425" y="125" fill="#44597a" font-size="18">and core radius</text><line x1="30" x2="710" y1="148" y2="148" stroke="#b8cce2"/><text x="30" y="166" fill="#44597a" font-size="13">THE 19 RETAINED INTERIORS</text><rect x="30" y="177" width="250.52631578947367" height="42" fill="#2a62b8"/><text x="155.26315789473682" y="204" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">7</text><rect x="280.52631578947364" y="177" width="178.94736842105263" height="42" fill="#397b83"/><text x="369.99999999999994" y="204" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">5</text><rect x="459.47368421052624" y="177" width="250.52631578947367" height="42" fill="#83649e"/><text x="584.7368421052631" y="204" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">7</text><rect x="30" y="247" width="12" height="12" rx="2" fill="#2a62b8"/><text x="50" y="258" font-size="17" fill="#44597a">Homogeneous</text><rect x="260" y="247" width="12" height="12" rx="2" fill="#397b83"/><text x="280" y="258" font-size="17" fill="#44597a">Layered</text><rect x="490" y="247" width="12" height="12" rx="2" fill="#83649e"/><text x="510" y="258" font-size="17" fill="#44597a">FeO-rich</text></g></svg>